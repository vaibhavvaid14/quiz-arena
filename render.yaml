# Render blueprint (https://render.com/docs/blueprint-spec).
#
# To deploy: in the Render dashboard choose New > Blueprint, pick this repo and
# apply. Render reads this file and creates the service; nothing else to set up.
#
# Render has no native JVM runtime, so the service is built from the Dockerfile,
# which compiles the Ktor server and the Kotlin/JS bundle and ships both.
# PORT comes from Render; the Dockerfile sets HOST=0.0.0.0 so the container
# accepts traffic.
services:
  - type: web
    name: quiz-arena
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health

# Note on the free plan: the filesystem is wiped on every deploy and the service
# sleeps after ~15 minutes idle, so players, history and the leaderboard reset
# when it restarts. Questions are re-seeded from the bundled question bank on
# each boot, so the quiz itself always works. Expect the first request after a
# nap to take longer than the Python version did: the container has to start and
# then the JVM has to boot.
#
# To keep scores permanently, add a persistent disk and point the database at it:
#
#   disk:
#     name: quiz-data
#     mountPath: /var/data
#     sizeGB: 1
#   envVars:
#     - key: QUIZ_DB
#       value: /var/data/quiz.db
#
# Disks are a paid feature and also stop the service sleeping.
