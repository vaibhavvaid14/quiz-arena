name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No packages to install: the app is standard library only.
      - name: Backend tests
        run: python -m unittest discover -s server/tests -t .

      # The browser suite drives the real UI against a real server on a
      # throwaway database. It sets the page title to "PASS n/n" or "FAIL n/n".
      - name: Browser tests
        run: |
          python serve.py --test --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health >/dev/null && break
            sleep 1
          done
          dom=$(google-chrome --headless=new --no-sandbox --disable-gpu \
                  --virtual-time-budget=120000 \
                  --dump-dom http://127.0.0.1:8000/tests/)
          title=$(printf '%s' "$dom" | grep -o '<title>[^<]*</title>')
          echo "$title"
          printf '%s' "$title" | grep -q 'PASS'
