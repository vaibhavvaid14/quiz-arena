<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Arena — visual preview</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="../css/styles.css" />
    <script type="module" src="preview.js"></script>
  </head>
  <body>
    <!--
      Design preview harness (served by `python serve.py --test` only): seeds the
      throwaway database through the API, then puts the real app in a given state.
        ?screen=setup|quiz|feedback|results|history|leaderboard   &theme=light|dark
    -->
    <header class="site-header" id="site-header">
      <div class="site-header-inner">
        <a class="brand" href="#" data-nav="setup"><span class="brand-mark" aria-hidden="true">🧠</span><span>Quiz Arena</span></a>
        <nav class="site-nav" aria-label="Main">
          <a href="#setup" data-nav="setup">Play</a>
          <a href="#history" data-nav="history">History</a>
          <a href="#leaderboard" data-nav="leaderboard">Leaderboard</a>
          <button type="button" class="icon-button" data-theme-toggle aria-pressed="false"><span data-theme-icon aria-hidden="true">🌙</span></button>
        </nav>
      </div>
    </header>
    <main id="app" class="app" tabindex="-1"></main>
  </body>
</html>
